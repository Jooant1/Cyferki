<title>LiczSprint</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: telefonowa kolumna dla gracza (okrągłe kafelki, czerwony akcent, lawenda), szeroki panel dwukolumnowy dla ownera. */
:root{
  --bg:#F1F1F5; --card:#FFFFFF; --soft:#E9E9F0; --ink:#17141F; --mute:#6E6B7B; --line:#E2E1EA;
  --red:#E0123F; --red-ink:#FFFFFF; --lav:#B79CF5; --lav-soft:#E8DFFD; --good:#1E9E6A; --bad:#E0123F;
  --shadow:0 1px 2px rgba(23,20,31,.04),0 8px 24px rgba(23,20,31,.06);
  --font:'Poppins',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121018; --card:#1C1A26; --soft:#262332; --ink:#F3F1FA; --mute:#9B97AD; --line:#2D2A3B;
  --red:#F0345C; --lav:#9B7FEA; --lav-soft:#2E2650; --good:#3CC48B; --bad:#FF6B88;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121018; --card:#1C1A26; --soft:#262332; --ink:#F3F1FA; --mute:#9B97AD; --line:#2D2A3B;
  --red:#F0345C; --lav:#9B7FEA; --lav-soft:#2E2650; --good:#3CC48B; --bad:#FF6B88;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.3); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:440px;margin:0 auto;padding-inline:16px;padding-block:20px 104px;min-width:0}
.wrap.wide{max-width:1040px;padding-bottom:40px}
h1,h2,h3,p{margin:0}
.eyebrow{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--mute);font-weight:500}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:54px;border-radius:16px;font-weight:600;font-size:16px;transition:transform .12s,opacity .12s}
.btn:active{transform:scale(.98)}
.btn.red{background:var(--red);color:var(--red-ink)}
.btn.grey{background:var(--soft)}
.btn.sm{height:40px;font-size:13px;border-radius:12px;width:auto;padding-inline:16px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;height:38px;padding-inline:16px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-weight:500;font-size:13px;white-space:nowrap}
.chip.on{background:var(--red);border-color:var(--red);color:var(--red-ink)}
.row{display:flex;align-items:center;gap:12px}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:16px}
.card{background:var(--card);border-radius:20px;padding:16px;box-shadow:var(--shadow)}
.tile{background:var(--soft);border-radius:16px;padding:12px 14px;min-width:0}
.tile .k{font-size:12px;color:var(--mute)}
.tile .v{font-size:20px;font-weight:600}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.iconbtn{width:44px;height:44px;border-radius:50%;background:var(--card);display:grid;place-items:center;box-shadow:var(--shadow)}
.seg{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.muted{color:var(--mute)}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;background:var(--lav-soft);font-size:11px;font-weight:600}
.pill.red{background:var(--red);color:var(--red-ink)}
.sec-title{font-size:18px;font-weight:600}
.err{color:var(--bad);font-size:13px;min-height:20px}

/* logowanie */
.collage{position:relative;height:250px;margin-bottom:8px}
.dot{position:absolute;border-radius:50%;display:grid;place-items:center;font-weight:700;overflow:hidden}
.lanes{background-image:repeating-linear-gradient(0deg,transparent 0 22px,rgba(255,255,255,.55) 22px 24px)}
.logo{position:absolute;left:0;top:0;width:56px;height:56px;border-radius:50%;background:var(--red);display:grid;place-items:center}
.hero-h{font-size:36px;line-height:1.1;font-weight:600;letter-spacing:-.02em;text-wrap:balance}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;color:var(--mute);font-weight:500}
.field input{height:52px;border-radius:14px;border:1px solid var(--line);background:var(--card);padding-inline:16px;font-size:16px;width:100%}
.field input:focus{border-color:var(--red);outline:none}

/* ranga */
.ringbox{position:relative;width:208px;height:208px;margin:6px auto 0}
.ringbox svg{position:absolute;inset:0}
.ringin{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ringin b{font-size:28px;font-weight:600;line-height:1.1}

/* wykres */
.chartbox{position:relative;width:100%}
.chartbox svg{display:block;width:100%;height:auto;touch-action:pan-y;overflow:visible}
.ct{font-size:10px;fill:var(--mute);font-family:var(--font)}
.tip{font-size:11px;font-weight:600;fill:#fff;font-family:var(--font)}

/* gra */
.q{font-size:68px;font-weight:700;letter-spacing:-.02em;text-align:center;padding-block:18px;line-height:1.1}
.q.shake{animation:shake .25s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.ans{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.ans button{height:56px;border-radius:16px;background:var(--card);box-shadow:var(--shadow);font-size:20px;font-weight:600}
.ans button:active{background:var(--lav-soft)}
.ans button.bad{background:var(--red);color:var(--red-ink)}
.hud{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:16px;border-radius:20px;background:var(--card);box-shadow:var(--shadow)}
.opt[disabled]{opacity:.55;cursor:not-allowed}
.opt .ic{width:48px;height:48px;border-radius:50%;background:var(--lav-soft);display:grid;place-items:center;font-weight:700;font-size:18px;flex:none}
.opt.red .ic{background:var(--red);color:var(--red-ink)}

/* nawigacja */
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;background:var(--card);border-top:1px solid var(--line);padding:8px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.nav>div{display:flex;width:100%;max-width:440px}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--mute);padding:6px}
.nav button.on{color:var(--red)}

/* leaderboard */
.podium{border-radius:24px;padding:20px 16px 16px;background:linear-gradient(160deg,var(--lav-soft),var(--lav));display:flex;flex-direction:column;align-items:center;gap:12px;position:relative;overflow:hidden}
.avatar{border-radius:50%;display:grid;place-items:center;font-weight:600;color:#fff;flex:none}
.lrow{display:grid;grid-template-columns:28px 44px 1fr auto;gap:12px;align-items:center;padding-block:12px;border-bottom:1px solid var(--line)}
.lrow:last-child{border-bottom:0}
.rk{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:600}
.rk.first{background:var(--red);color:var(--red-ink)}

/* owner */
.owner-grid{display:grid;grid-template-columns:320px 1fr;gap:20px;align-items:start}
@media (max-width:820px){.owner-grid{grid-template-columns:1fr}}
.plist button{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;padding:10px;border-radius:16px}
.plist button.on{background:var(--lav-soft)}
.plist button:hover{background:var(--soft)}
.trow{display:grid;grid-template-columns:1fr auto auto;gap:14px;align-items:center;width:100%;text-align:left;padding:10px 12px;border-radius:14px}
.trow:hover,.trow.on{background:var(--soft)}
.feed{display:flex;flex-direction:column;gap:4px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div id="app"></div>

<script>
(function(){
'use strict';
const $app=document.getElementById('app');
const mem={};
const LS={
  get(k,d){try{const v=localStorage.getItem(k);return v==null?(k in mem?mem[k]:d):JSON.parse(v)}catch(e){return k in mem?mem[k]:d}},
  set(k,v){mem[k]=v;try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const slug=n=>'p'+Array.from(new TextEncoder().encode(n.trim().toLowerCase())).map(b=>b.toString(16).padStart(2,'0')).join('');
async function sha(s){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('liczsprint:'+s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){let h=5381;for(const c of s)h=((h<<5)+h+c.charCodeAt(0))|0;return 'x'+h}}

/* ---------- dane ---------- */
let users=LS.get('ls_users',{});          // konta na tym urządzeniu
let session=LS.get('ls_session',null);   // zapamiętane logowanie
let seen=LS.get('ls_seen',{});            // owner: kiedy ostatnio oglądał gracza
let remote={};                            // dane z synchronizacji (db)
let dbr=null;                             // namespace db, gdy dostępny
let route=location.hash==='#owner'?'owner':'player';
let view='home', tab='login', chartOpen=false, chartMode='all', lbMode='pts', mode=null;
let G=null, lastResult=null, loginErr='', ownerSel=null, ownerTest=null, ownerAuth=false;

const CATS={add:{n:'Dodawanie do 20',sym:'+',min:2,max:20},sub:{n:'Odejmowanie do 20',sym:'−',min:0,max:19},mix:{n:'Mieszane',sym:'±',min:0,max:20}};
const RANKS=[{n:'Brąz',min:0,c:'#C27B4A'},{n:'Srebro',min:150,c:'#9AA3B2'},{n:'Złoto',min:500,c:'#E0A81B'},{n:'Platyna',min:1200,c:'#35B7B7'},{n:'Diament',min:2500,c:'#7C6CF0'}];
function rankOf(p){let i=0;RANKS.forEach((r,j)=>{if(p>=r.min)i=j});const r=RANKS[i],nx=RANKS[i+1];return{i,r,nx,pct:nx?(p-r.min)/(nx.min-r.min):1}}

function stats(tests){
  const ops=tests.reduce((a,t)=>a+t.ops,0),wrong=tests.reduce((a,t)=>a+t.wrong,0),secs=tests.reduce((a,t)=>a+t.sec,0);
  const perMin=secs>0?ops/(secs/60):0;
  return{ops,wrong,n:tests.length,secs,perMin,per30:perMin/2,best:tests.reduce((a,t)=>Math.max(a,t.perMin),0),acc:ops+wrong>0?ops/(ops+wrong):0,
    today:tests.filter(t=>new Date(t.ts).toDateString()===new Date().toDateString()).reduce((a,t)=>a+t.ops,0)}
}
function merged(){
  const m={};
  for(const [k,u] of Object.entries(users)) m[k]={key:k,name:u.name,tests:[...u.tests]};
  for(const [k,r] of Object.entries(remote)){
    if(!m[k]) m[k]={key:k,name:r.name||'Gracz',tests:[]};
    const ids=new Set(m[k].tests.map(t=>t.id));
    (r.tests||[]).forEach(t=>{if(!ids.has(t.id))m[k].tests.push(t)});
  }
  return Object.values(m).map(p=>{p.tests.sort((a,b)=>a.ts-b.ts);p.s=stats(p.tests);p.rank=rankOf(p.s.ops);return p});
}
const me=()=>session&&users[session]?users[session]:null;

/* ---------- formatowanie ---------- */
const fT=s=>{s=Math.round(s);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const f1=n=>(Math.round(n*10)/10).toLocaleString('pl-PL');
const fD=ts=>new Date(ts).toLocaleDateString('pl-PL',{day:'numeric',month:'short'})+', '+new Date(ts).toLocaleTimeString('pl-PL',{hour:'2-digit',minute:'2-digit'});
const hues=['#7C6CF0','#E0123F','#1E9E6A','#D9822B','#3B8FD9','#B24BC9'];
const avatar=(name,sz)=>{let h=0;for(const c of name)h=(h*31+c.charCodeAt(0))%hues.length;return `<span class="avatar" style="width:${sz}px;height:${sz}px;background:${hues[h]};font-size:${Math.round(sz*.4)}px">${esc(name.trim().charAt(0).toUpperCase())}</span>`};
const ico={
  home:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l8-7 8 7v8a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1z"/></svg>',
  board:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M9 16v-4M12 16V8M15 16v-6"/></svg>',
  out:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h4M15 8l4 4-4 4M19 12H9"/></svg>',
  back:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
  logo:'<svg width="30" height="30" viewBox="0 0 30 30" fill="none"><path d="M7 11h12l-5 4h9M23 19H11l5-4H7" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>'
};

/* ---------- wykres ---------- */
function mountChart(el,pts,opt){
  opt=opt||{};
  if(pts.length<2){el.innerHTML='<p class="muted" style="padding:28px 8px;text-align:center">'+(opt.empty||'Za mało danych na wykres.')+'</p>';return}
  const W=360,H=210,L=36,R=14,T=30,B=28;
  const xs=pts.map(p=>p.x),ys=pts.map(p=>p.y);
  const x0=Math.min(...xs),x1=Math.max(...xs),yMax=Math.max(...ys),yMin=0;
  const niceMax=(m=>{if(m<=0)return 1;const p=Math.pow(10,Math.floor(Math.log10(m)));const f=m/p;return (f<=1?1:f<=2?2:f<=5?5:10)*p})(yMax*1.08);
  const sx=x=>L+(x1===x0?0:(x-x0)/(x1-x0))*(W-L-R), sy=y=>H-B-(y-yMin)/(niceMax-yMin)*(H-T-B);
  const line=pts.map((p,i)=>(i?'L':'M')+sx(p.x).toFixed(1)+' '+sy(p.y).toFixed(1)).join(' ');
  const area=line+` L${sx(x1).toFixed(1)} ${H-B} L${sx(x0).toFixed(1)} ${H-B} Z`;
  const gid='g'+Math.random().toString(36).slice(2,7);
  let grid='';for(let i=0;i<=3;i++){const v=niceMax*i/3,y=sy(v);grid+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-dasharray="${i?'3 4':'0'}"/><text class="ct" x="${L-6}" y="${y+3}" text-anchor="end">${Math.round(v*10)/10}</text>`}
  const lp=pts[pts.length-1];
  el.innerHTML=`<div class="chartbox"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opt.label||'Wykres')}">
    <defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--red)" stop-opacity=".32"/><stop offset="1" stop-color="var(--red)" stop-opacity="0"/></linearGradient></defs>
    ${grid}
    <path d="${area}" fill="url(#${gid})"/>
    <path d="${line}" fill="none" stroke="var(--red)" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
    <text class="ct" x="${L}" y="${H-8}" text-anchor="start">${esc(opt.x0||'')}</text>
    <text class="ct" x="${W-R}" y="${H-8}" text-anchor="end">${esc(opt.x1||'')}</text>
    <g class="hover"><line class="vl" y1="${T-6}" y2="${H-B}" stroke="var(--red)" stroke-width="1.5"/><circle class="halo" r="9" fill="var(--red)" opacity=".2"/><circle class="dt" r="5" fill="var(--red)" stroke="var(--card)" stroke-width="2"/>
      <g class="tg"><rect class="tr" height="22" rx="11" fill="var(--lav)"/><text class="tip tt" y="15" text-anchor="middle"></text></g></g>
  </svg></div>`;
  const svg=el.querySelector('svg'),hv=svg.querySelector('.hover');
  function show(i){
    const p=pts[i],cx=sx(p.x),cy=sy(p.y),t=p.tip||String(p.y);
    hv.querySelector('.vl').setAttribute('x1',cx);hv.querySelector('.vl').setAttribute('x2',cx);hv.querySelector('.vl').setAttribute('y1',cy);
    hv.querySelectorAll('circle').forEach(c=>{c.setAttribute('cx',cx);c.setAttribute('cy',cy)});
    const w=Math.max(54,t.length*6.6+18);let rx=Math.min(Math.max(cx-w/2,2),W-w-2);
    const r=hv.querySelector('.tr');r.setAttribute('width',w);r.setAttribute('x',rx);r.setAttribute('y',Math.max(cy-38,2));
    const tx=hv.querySelector('.tt');tx.setAttribute('x',rx+w/2);tx.setAttribute('y',Math.max(cy-38,2)+15);tx.textContent=t;
  }
  show(pts.length-1);
  function move(e){const r=svg.getBoundingClientRect();const x=(e.clientX-r.left)/r.width*W;let b=0,bd=1e9;pts.forEach((p,i)=>{const d=Math.abs(sx(p.x)-x);if(d<bd){bd=d;b=i}});show(b)}
  svg.addEventListener('pointermove',move);svg.addEventListener('pointerdown',move);
  svg.addEventListener('pointerleave',()=>show(pts.length-1));
}
const ptsAll=tests=>tests.map((t,i)=>({x:i+1,y:Math.round(t.perMin*10)/10,tip:f1(t.perMin)+' dz./min · '+new Date(t.ts).toLocaleDateString('pl-PL',{day:'numeric',month:'short'})}));
const ptsTest=t=>(t.series||[]).map(([s,c])=>({x:s,y:c,tip:c+' dz. · '+fT(s)}));

/* ---------- synchronizacja ---------- */
async function pushRemote(key){
  if(!dbr||!users[key])return;
  const u=users[key];
  try{await dbr.doc('players/'+key).set({name:u.name,updated:Date.now(),tests:u.tests.slice(-40)})}catch(e){}
}
async function bootDb(){
  try{
    dbr=await (window.claude&&window.claude.use?window.claude.use('db'):null);
    if(!dbr)return;
    dbr.collection('players').onSnapshot(s=>{
      const r={};s.docs.forEach(d=>{const v=d.data();if(v)r[d.id]=v});remote=r;
      if(view!=='play')render();
    },()=>{});
    render();
  }catch(e){dbr=null}
}

/* ---------- gra ---------- */
function newQ(cat,prev){
  let q,tries=0;
  do{
    const c=cat==='mix'?(Math.random()<.5?'add':'sub'):cat;
    if(c==='add'){const a=1+Math.floor(Math.random()*19),b=1+Math.floor(Math.random()*(20-a));q={t:a+' + '+b,a:a+b}}
    else{const a=2+Math.floor(Math.random()*19),b=1+Math.floor(Math.random()*a);q={t:a+' − '+b,a:a-b}}
  }while(prev&&q.t===prev.t&&++tries<5);
  return q;
}
function gridRange(cat){return cat==='add'?[2,20]:[0,20]}
function startGame(cat){
  G={cat,t0:performance.now(),ok:0,wrong:0,series:[[0,0]],q:newQ(cat),tick:null};
  view='play';render();
  G.tick=setInterval(()=>{const el=document.getElementById('tm');if(el)el.textContent=fT((performance.now()-G.t0)/1000)},250);
}
function answer(n,btn){
  if(!G)return;
  if(n===G.q.a){
    G.ok++;G.series.push([Math.round((performance.now()-G.t0)/100)/10,G.ok]);G.q=newQ(G.cat,G.q);
    document.getElementById('qq').textContent=G.q.t;document.getElementById('ok').textContent=G.ok;
  }else{
    G.wrong++;document.getElementById('wr').textContent=G.wrong;
    const q=document.getElementById('qq');q.classList.remove('shake');void q.offsetWidth;q.classList.add('shake');
    if(btn){btn.classList.add('bad');setTimeout(()=>btn.classList.remove('bad'),300)}
  }
}
function downsample(s,n){if(s.length<=n)return s;const out=[];for(let i=0;i<n;i++)out.push(s[Math.round(i*(s.length-1)/(n-1))]);return out}
function finishGame(){
  clearInterval(G.tick);
  const sec=Math.max(1,(performance.now()-G.t0)/1000),u=me();
  const before=rankOf(stats(u.tests).ops).i;
  const t={id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),ts:Date.now(),cat:G.cat,ops:G.ok,wrong:G.wrong,sec:Math.round(sec*10)/10,perMin:Math.round(G.ok/(sec/60)*10)/10,
    series:downsample(G.series.concat([[Math.round(sec*10)/10,G.ok]]),100)};
  let saved=false;
  if(G.ok>0){u.tests.push(t);LS.set('ls_users',users);saved=true;pushRemote(session)}
  const after=rankOf(stats(u.tests).ops).i;
  lastResult={t,saved,up:after>before?RANKS[after].n:null};G=null;view='result';render();
}

/* ---------- widoki gracza ---------- */
function loginView(){
  const reg=tab==='reg';
  return `<div class="wrap">
  <div class="collage" aria-hidden="true">
    <div class="logo">${ico.logo}</div>
    <div class="dot lanes" style="width:190px;height:190px;left:46px;top:62px;background-color:var(--lav);color:#fff;font-size:34px">8 + 7</div>
    <div class="dot lanes" style="width:150px;height:150px;right:-30px;top:-8px;background-color:var(--red);color:#fff;font-size:44px">15</div>
    <div class="dot" style="width:78px;height:78px;right:62px;top:128px;background:var(--lav-soft);color:var(--ink);font-size:22px">12−5</div>
    <div class="dot" style="width:54px;height:54px;right:6px;top:176px;background:var(--soft);color:var(--ink);font-size:20px">=</div>
  </div>
  <p class="eyebrow">LiczSprint</p>
  <h1 class="hero-h" style="margin:8px 0 18px">Licz szybciej.<br>Z każdym testem.</h1>
  <form id="loginForm" class="stack" style="gap:12px" autocomplete="on">
    <div class="seg"><button type="button" class="chip ${reg?'':'on'}" data-act="tab" data-v="login">Zaloguj się</button><button type="button" class="chip ${reg?'on':''}" data-act="tab" data-v="reg">Załóż konto</button></div>
    <div class="field"><label for="nm">Imię</label><input id="nm" name="username" maxlength="16" autocomplete="username" required></div>
    <div class="field"><label for="pw">Hasło</label><input id="pw" name="password" type="password" minlength="3" autocomplete="${reg?'new-password':'current-password'}" required></div>
    <p class="err" id="lerr">${esc(loginErr)}</p>
    <button class="btn red" type="submit">${reg?'Załóż konto':'Zaloguj się'}</button>
  </form>
  <p class="muted" style="margin-top:18px;font-size:12px;text-align:center"><a href="#owner" style="color:inherit">Panel ownera →</a></p>
  </div>`;
}
function ring(s){
  const rk=rankOf(s.ops),C=2*Math.PI*88,off=C*(1-rk.pct);
  return `<div class="ringbox"><svg viewBox="0 0 208 208"><circle cx="104" cy="104" r="88" fill="none" stroke="var(--soft)" stroke-width="14"/>
  <circle cx="104" cy="104" r="88" fill="none" stroke="var(--red)" stroke-width="14" stroke-linecap="round" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}" transform="rotate(-90 104 104)"/></svg>
  <div class="ringin"><span class="eyebrow" style="letter-spacing:.14em">Ranga</span><b style="color:${rk.r.c}">${rk.r.n}</b><span class="muted num" style="font-size:12px">${s.ops}${rk.nx?' / '+rk.nx.min:''} pkt</span></div></div>
  <p class="muted" style="text-align:center;font-size:12px;margin-top:8px">${rk.nx?'Do rangi '+rk.nx.n+': '+(rk.nx.min-s.ops)+' działań':'Najwyższa ranga'}</p>`;
}
function homeView(){
  const u=me(),s=stats(u.tests);
  return `<div class="wrap stack">
  <div class="row between"><div><p class="muted" style="font-size:12px">Cześć,</p><h1 style="font-size:24px;font-weight:600">${esc(u.name)}</h1></div>
  <button class="iconbtn" data-act="logout" aria-label="Wyloguj">${ico.out}</button></div>
  <div>${ring(s)}</div>
  <button class="btn red" data-act="pickmode">Zacznij grę</button>
  <button class="btn grey" data-act="chart" aria-expanded="${chartOpen}">${chartOpen?'Ukryj wykres':'Pokaż wykres'}</button>
  ${chartOpen?`<div class="card stack" style="gap:12px"><div class="seg"><button class="chip ${chartMode==='all'?'on':''}" data-act="cmode" data-v="all">Wszystkie testy</button><button class="chip ${chartMode==='last'?'on':''}" data-act="cmode" data-v="last">Ostatni test</button></div><div id="chartEl"></div></div>`:''}
  <h2 class="sec-title">Twoje statystyki</h2>
  <div class="grid2">
    <div class="tile"><div class="k">Działania</div><div class="v num">${s.ops}</div></div>
    <div class="tile"><div class="k">Testy</div><div class="v num">${s.n}</div></div>
    <div class="tile"><div class="k">Działań / minutę</div><div class="v num">${f1(s.perMin)}</div></div>
    <div class="tile"><div class="k">Działań / 30 s</div><div class="v num">${f1(s.per30)}</div></div>
    <div class="tile"><div class="k">Najlepszy wynik</div><div class="v num">${f1(s.best)}<span class="muted" style="font-size:12px;font-weight:400"> /min</span></div></div>
    <div class="tile"><div class="k">Celność</div><div class="v num">${s.n?Math.round(s.acc*100)+'%':'—'}</div></div>
  </div>
  </div>${nav('home')}`;
}
function nav(on){return `<nav class="nav"><div><button class="${on==='home'?'on':''}" data-act="go" data-v="home">${ico.home}Start</button><button class="${on==='board'?'on':''}" data-act="go" data-v="board">${ico.board}Ranking</button></div></nav>`}
function modeView(){
  return `<div class="wrap stack">
  <div class="row"><button class="iconbtn" data-act="go" data-v="home" aria-label="Wróć">${ico.back}</button><h1 style="font-size:20px;font-weight:600">Wybierz tryb</h1></div>
  <button class="opt red" data-act="solo"><span class="ic">1</span><span><b style="display:block">Jednoosobowy</b><span class="muted" style="font-size:12px">Liczysz sam, aż klikniesz Koniec</span></span></button>
  <button class="opt" disabled><span class="ic">2+</span><span><b style="display:block">Wieloosobowy</b><span class="muted" style="font-size:12px">Wkrótce</span></span></button>
  </div>`;
}
function catView(){
  return `<div class="wrap stack">
  <div class="row"><button class="iconbtn" data-act="pickmode" aria-label="Wróć">${ico.back}</button><h1 style="font-size:20px;font-weight:600">Wybierz kategorię</h1></div>
  ${Object.entries(CATS).map(([k,c])=>`<button class="opt" data-act="start" data-v="${k}"><span class="ic">${c.sym}</span><span><b style="display:block">${c.n}</b><span class="muted" style="font-size:12px">Odpowiedzi od ${gridRange(k)[0]} do ${gridRange(k)[1]}</span></span></button>`).join('')}
  <button class="opt" disabled><span class="ic">×</span><span><b style="display:block">Mnożenie</b><span class="muted" style="font-size:12px">Wkrótce</span></span></button>
  </div>`;
}
function playView(){
  const [a,b]=gridRange(G.cat);let btns='';for(let i=a;i<=b;i++)btns+=`<button data-act="ans" data-v="${i}" class="num">${i}</button>`;
  return `<div class="wrap stack">
  <div class="hud"><div class="tile"><div class="k">Czas</div><div class="v num" id="tm">0:00</div></div><div class="tile"><div class="k">Dobrze</div><div class="v num" id="ok" style="color:var(--good)">0</div></div><div class="tile"><div class="k">Błędy</div><div class="v num" id="wr" style="color:var(--bad)">0</div></div></div>
  <div class="card"><div class="q num" id="qq">${G.q.t}</div><p class="muted" style="text-align:center;font-size:12px">Wybierz wynik</p></div>
  <div class="ans">${btns}</div>
  <button class="btn red" data-act="end">Koniec</button>
  </div>`;
}
function resultView(){
  const {t,saved,up}=lastResult,u=me(),sy=!!dbr;
  return `<div class="wrap stack">
  <div class="card" style="text-align:center;padding:24px 16px"><p class="eyebrow">Test zakończony</p>
  <p class="num" style="font-size:56px;font-weight:700;line-height:1.1;margin-top:8px">${f1(t.perMin)}</p><p class="muted">działań na minutę</p>
  ${up?`<p style="margin-top:12px"><span class="pill red">Nowa ranga: ${up}</span></p>`:''}</div>
  <div class="grid2"><div class="tile"><div class="k">Działania</div><div class="v num">${t.ops}</div></div><div class="tile"><div class="k">Czas</div><div class="v num">${fT(t.sec)}</div></div>
  <div class="tile"><div class="k">Na 30 s</div><div class="v num">${f1(t.perMin/2)}</div></div><div class="tile"><div class="k">Błędy</div><div class="v num">${t.wrong}</div></div></div>
  <div class="card"><div id="chartEl"></div></div>
  <p class="muted" style="font-size:12px;text-align:center">${saved?(sy?'Wynik wysłany do ownera.':'Wynik zapisany na tym urządzeniu i widoczny w panelu ownera w tej przeglądarce.'):'Brak poprawnych odpowiedzi, test nie został zapisany.'}</p>
  <button class="btn red" data-act="solo">Zagraj ponownie</button><button class="btn grey" data-act="go" data-v="home">Wróć na start</button></div>`;
}
function boardView(){
  const all=merged().filter(p=>p.tests.length);
  const val=p=>lbMode==='pts'?p.s.ops:lbMode==='best'?p.s.best:p.s.today;
  const fmt=p=>lbMode==='best'?f1(val(p))+'/min':val(p)+' dz.';
  all.sort((a,b)=>val(b)-val(a));
  const top=all[0],u=me();
  return `<div class="wrap stack">
  <h1 style="font-size:22px;font-weight:600;text-align:center;padding-block:8px">Ranking</h1>
  <div class="seg"><button class="chip ${lbMode==='pts'?'on':''}" data-act="lb" data-v="pts">Wszech czasów</button><button class="chip ${lbMode==='best'?'on':''}" data-act="lb" data-v="best">Najszybsi</button><button class="chip ${lbMode==='today'?'on':''}" data-act="lb" data-v="today">Dziś</button></div>
  ${top?`<div class="podium">${avatar(top.name,76)}<div class="row" style="gap:8px;flex-wrap:wrap;justify-content:center"><span class="chip num" style="background:var(--card)">${fmt(top)}</span><span class="chip" style="background:var(--card)">${esc(top.name)}</span></div></div>`:`<div class="card" style="text-align:center;padding:28px 16px"><p class="muted">Nikt jeszcze nie skończył testu. Zagraj pierwszy.</p></div>`}
  <div class="card" style="padding-block:4px">${all.map((p,i)=>`<div class="lrow"><span class="rk ${i===0?'first':''} num">${i+1}</span>${avatar(p.name,44)}<div style="min-width:0"><b style="display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(p.name)}${u&&p.key===session?' (Ty)':''}</b><span class="muted" style="font-size:12px">${p.rank.r.n} · ${p.s.n} ${p.s.n===1?'test':'testów'}</span></div><b class="num">${fmt(p)}</b></div>`).join('')||'<p class="muted" style="padding:16px">Brak wyników.</p>'}</div>
  </div>${nav('board')}`;
}

/* ---------- panel ownera ---------- */
function ownerView(){
  const code=LS.get('ls_owner',null);
  if(!ownerAuth){
    return `<div class="wrap"><p class="eyebrow">LiczSprint</p><h1 class="hero-h" style="margin:8px 0 18px">Panel ownera</h1>
    <form id="ownerForm" class="stack" style="gap:12px"><div class="field"><label for="oc">${code?'Kod ownera':'Ustaw kod ownera (min. 3 znaki)'}</label><input id="oc" type="password" minlength="3" required autocomplete="off"></div>
    <p class="err" id="oerr"></p><button class="btn red" type="submit">${code?'Wejdź':'Ustaw kod i wejdź'}</button></form>
    <p class="muted" style="margin-top:18px;font-size:12px"><a href="#" style="color:inherit">← Strona gracza</a></p></div>`;
  }
  const P=merged().sort((a,b)=>((b.tests.at(-1)||{ts:0}).ts)-((a.tests.at(-1)||{ts:0}).ts));
  const sel=P.find(p=>p.key===ownerSel);
  const unread=p=>p.tests.filter(t=>t.ts>(seen[p.key]||0)).length;
  const feed=P.flatMap(p=>p.tests.map(t=>({p,t}))).sort((a,b)=>b.t.ts-a.t.ts).slice(0,8);
  return `<div class="wrap wide stack">
  <div class="row between" style="flex-wrap:wrap"><div><p class="eyebrow">LiczSprint</p><h1 style="font-size:26px;font-weight:600">Panel ownera</h1></div>
  <div class="row"><span class="pill">${dbr?'Synchronizacja włączona':'Tylko ta przeglądarka'}</span><a href="#" class="btn grey sm">Strona gracza</a></div></div>
  <div class="owner-grid">
   <div class="card" style="padding:12px"><p class="sec-title" style="padding:4px 8px 8px">Gracze <span class="muted num" style="font-size:13px;font-weight:400">${P.length}</span></p>
    <div class="plist">${P.map(p=>`<button data-act="osel" data-v="${p.key}" class="${p.key===ownerSel?'on':''}">${avatar(p.name,44)}<span style="min-width:0"><b style="display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(p.name)}</b><span class="muted" style="font-size:12px">${p.rank.r.n} · ${p.s.n} ${p.s.n===1?'test':'testów'}</span></span>${unread(p)?`<span class="pill red num">+${unread(p)}</span>`:''}</button>`).join('')||'<p class="muted" style="padding:12px 8px">Nikt jeszcze się nie zarejestrował. Gracze pojawią się tu po założeniu konta.</p>'}</div></div>
   <div class="stack" style="min-width:0">${sel?ownerDetail(sel):`<div class="card"><p class="sec-title" style="margin-bottom:8px">Ostatnio ukończone testy</p><div class="feed">${feed.map(({p,t})=>`<button class="trow" data-act="osel" data-v="${p.key}"><span style="min-width:0"><b>${esc(p.name)}</b> <span class="muted" style="font-size:12px">${CATS[t.cat]?CATS[t.cat].n:''} · ${fD(t.ts)}</span></span><span class="num"><b>${f1(t.perMin)}</b> <span class="muted" style="font-size:12px">dz./min</span></span><span class="num muted" style="font-size:12px">${t.ops} dz.</span></button>`).join('')||'<p class="muted" style="padding:8px 4px">Gdy gracz kliknie Koniec, jego test pojawi się tutaj.</p>'}</div></div>`}</div>
  </div></div>`;
}
function ownerDetail(p){
  const s=p.s,t=p.tests.find(x=>x.id===ownerTest);
  return `<div class="card stack" style="gap:14px"><div class="row" style="gap:14px">${avatar(p.name,56)}<div style="min-width:0"><h2 style="font-size:20px;font-weight:600;overflow:hidden;text-overflow:ellipsis">${esc(p.name)}</h2><span class="pill">${p.rank.r.n}</span></div></div>
  <div class="grid3"><div class="tile"><div class="k">Testy</div><div class="v num">${s.n}</div></div><div class="tile"><div class="k">Działania</div><div class="v num">${s.ops}</div></div><div class="tile"><div class="k">Celność</div><div class="v num">${s.n?Math.round(s.acc*100)+'%':'—'}</div></div>
  <div class="tile"><div class="k">Dz. / minutę</div><div class="v num">${f1(s.perMin)}</div></div><div class="tile"><div class="k">Dz. / 30 s</div><div class="v num">${f1(s.per30)}</div></div><div class="tile"><div class="k">Najlepszy</div><div class="v num">${f1(s.best)}</div></div></div></div>
  <div class="card stack" style="gap:12px"><div class="row between" style="flex-wrap:wrap"><p class="sec-title">${t?'Przebieg testu':'Wszystkie testy'}</p>${t?'<button class="chip" data-act="otest" data-v="">Pokaż wszystkie</button>':''}</div>
  ${t?`<p class="muted" style="font-size:12px">${fD(t.ts)} · ${CATS[t.cat]?CATS[t.cat].n:''} · ${fT(t.sec)} · ${t.ops} dz. · ${t.wrong} błędów</p>`:''}<div id="chartEl"></div></div>
  <div class="card"><p class="sec-title" style="margin-bottom:6px">Wykonane testy</p><div class="feed">${p.tests.slice().reverse().map(x=>`<button class="trow ${x.id===ownerTest?'on':''}" data-act="otest" data-v="${x.id}"><span style="min-width:0"><b>${fD(x.ts)}</b> <span class="muted" style="font-size:12px">${CATS[x.cat]?CATS[x.cat].n:''}</span></span><span class="num"><b>${f1(x.perMin)}</b> <span class="muted" style="font-size:12px">dz./min</span></span><span class="num muted" style="font-size:12px">${x.ops} dz. · ${fT(x.sec)}</span></button>`).join('')||'<p class="muted" style="padding:8px 4px">Ten gracz nie skończył jeszcze żadnego testu.</p>'}</div></div>`;
}

/* ---------- render ---------- */
function render(){
  if(route==='owner'){
    $app.innerHTML=ownerView();
    const el=document.getElementById('chartEl');
    if(el&&ownerAuth){const p=merged().find(x=>x.key===ownerSel);if(p){const t=p.tests.find(x=>x.id===ownerTest);
      if(t)mountChart(el,ptsTest(t),{x0:'0:00',x1:fT(t.sec),label:'Przebieg testu',empty:'Brak danych przebiegu.'});
      else mountChart(el,ptsAll(p.tests),{x0:'Test 1',x1:'Test '+p.tests.length,label:'Dzialania na minute w kolejnych testach',empty:'Wykres pojawi się po dwóch testach.'})}}
    return;
  }
  if(session&&!users[session])session=null;
  if(!session){$app.innerHTML=loginView();return}
  const v={home:homeView,mode:modeView,cat:catView,play:()=>G?playView():homeView(),result:()=>lastResult?resultView():homeView(),board:boardView}[view]||homeView;
  $app.innerHTML=v();
  const el=document.getElementById('chartEl');
  if(el){
    const u=me();
    if(view==='result')mountChart(el,ptsTest(lastResult.t),{x0:'0:00',x1:fT(lastResult.t.sec),label:'Przebieg testu'});
    else if(chartMode==='last'){const t=u.tests.at(-1);t?mountChart(el,ptsTest(t),{x0:'0:00',x1:fT(t.sec),label:'Ostatni test',empty:'Brak danych.'}):mountChart(el,[],{empty:'Zagraj pierwszy test, żeby zobaczyć wykres.'})}
    else mountChart(el,ptsAll(u.tests),{x0:'Test 1',x1:'Test '+u.tests.length,label:'Wyniki ze wszystkich testów',empty:'Wykres pojawi się po dwóch testach.'});
  }
  window.scrollTo(0,0);
}

/* ---------- zdarzenia ---------- */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b||b.disabled)return;
  const a=b.dataset.act,v=b.dataset.v;
  if(a==='tab'){tab=v;loginErr='';render();return}
  if(a==='logout'){session=null;LS.set('ls_session',null);view='home';render();return}
  if(a==='go'){view=v;render();return}
  if(a==='pickmode'){view='mode';render();return}
  if(a==='solo'){view='cat';render();return}
  if(a==='start'){startGame(v);return}
  if(a==='ans'){answer(+v,b);return}
  if(a==='end'){finishGame();return}
  if(a==='chart'){chartOpen=!chartOpen;render();return}
  if(a==='cmode'){chartMode=v;render();return}
  if(a==='lb'){lbMode=v;render();return}
  if(a==='osel'){ownerSel=v;ownerTest=null;seen[v]=Date.now();LS.set('ls_seen',seen);render();return}
  if(a==='otest'){ownerTest=v||null;render();return}
});
document.addEventListener('submit',async e=>{
  e.preventDefault();
  if(e.target.id==='loginForm'){
    const name=document.getElementById('nm').value.trim(),pw=document.getElementById('pw').value,key=slug(name);
    if(name.length<2){loginErr='Imię musi mieć co najmniej 2 znaki.';render();return}
    const h=await sha(pw);
    if(tab==='reg'){
      if(users[key]||remote[key]){loginErr='To imię jest już zajęte. Wybierz inne.';render();return}
      users[key]={name,hash:h,created:Date.now(),tests:[]};LS.set('ls_users',users);
    }else{
      if(!users[key]){loginErr='Nie ma takiego konta na tym urządzeniu. Załóż konto.';render();return}
      if(users[key].hash!==h){loginErr='Nieprawidłowe hasło.';render();return}
    }
    session=key;LS.set('ls_session',key);loginErr='';view='home';render();
  }
  if(e.target.id==='ownerForm'){
    const v=document.getElementById('oc').value,h=await sha('owner:'+v),code=LS.get('ls_owner',null);
    if(!code){LS.set('ls_owner',h);ownerAuth=true;render()}
    else if(code===h){ownerAuth=true;render()}
    else document.getElementById('oerr').textContent='Nieprawidłowy kod.';
  }
});
window.addEventListener('hashchange',()=>{route=location.hash==='#owner'?'owner':'player';render()});
window.addEventListener('storage',()=>{users=LS.get('ls_users',users);if(view!=='play')render()});
render();bootDb();
})();
</script>
